<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="apple-touch-icon" href="./icons/icon-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MakerPixel Gestão Interna | Painel Operacional & Societário</title>

    <!-- PWA Web App Manifest & Meta Tags -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#2F5BEA" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MakerPixel" />
    <meta name="application-name" content="MakerPixel" />
    <meta name="msapplication-TileColor" content="#0E1726" />

    <!-- Plus Jakarta Sans Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-maker-bg dark:bg-maker-darkBg text-slate-800 dark:text-slate-100 font-sans antialiased selection:bg-maker-primary/20 selection:text-maker-primary">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Registro do Service Worker PWA -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => {
              console.log('MakerPixel PWA Service Worker registrado com sucesso:', reg.scope);
            })
            .catch(err => {
              console.warn('Falha ao registrar Service Worker PWA:', err);
            });
        });
      }
    </script>
  </body>
</html>
